services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-settlement_hub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-settlement_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-settlement_hub}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      NTS_API_KEY: ${NTS_API_KEY:-}
      KASI_API_KEY: ${KASI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    # 기동 시 마이그레이션 적용 후 서버 시작
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-settlement_hub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      NTS_API_KEY: ${NTS_API_KEY:-}
      KASI_API_KEY: ${KASI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    command: python -m app.worker
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started  # api가 마이그레이션을 먼저 적용한다

  frontend:
    build:
      context: ./frontend
      args:
        # 컨테이너 네트워크 내부 주소 — 브라우저가 아니라 frontend 서버가 호출한다
        API_ORIGIN: http://api:8000
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  uploads:
