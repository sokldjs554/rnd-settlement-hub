# Render Blueprint — Backend 배포 정의
# 사용: Render 대시보드 → New → Blueprint → 이 저장소 연결
# DB는 Neon(또는 Render Postgres)을 쓰고 DATABASE_URL을 환경변수로 주입한다.
#
# 구성 노트: API와 워커를 한 서비스에서 함께 실행한다.
# 증빙 파일이 로컬 디스크(볼륨)에 저장되는 MVP 구조에서는 워커가 같은 디스크를
# 읽어야 하는데, Render의 disk는 서비스 간 공유가 안 되기 때문이다.
# 규모가 커지면: 파일 저장을 S3로 교체(app/services/storage.py만 수정)한 뒤
# 워커를 별도 type: worker 서비스로 분리한다. (README 한계점/향후 개선 참고)
services:
  - type: web
    name: settlement-hub-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && (python -m app.worker &) && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Neon 연결 문자열 (postgresql+psycopg://... 형식)
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5
      - key: NTS_API_KEY
        sync: false
      - key: KASI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
